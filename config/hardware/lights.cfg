#####################################################################
# 	Chamber lighting
#####################################################################
# Effects: led_effects/stealthburner_led_effects_3_leds.cfg (toolhead + STATUS_* macros),
#          led_effects/chamber_led_effects.cfg (this strip)

[output_pin caselight]
# Chamber light - HE3 connector
pin: PA3
pwm: true
shutdown_value: 0
cycle_time: 0.01

[neopixel disco_stick]
pin: PD15
chain_count: 36
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3
