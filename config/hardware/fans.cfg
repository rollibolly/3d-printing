#####################################################################
# 	Chamber & electronics fans (mainboard FAN headers)
#####################################################################
# Toolhead fans are in toolhead.cfg.

[fan_generic nevermore]
# Nevermore filter
pin: PF8
kick_start_time: 0.5
off_below: 0.10

[fan_generic exhaust_fan]
# Exhaust fan
pin: PF7
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5

[controller_fan controller_fan_1]
# Electronics bay, runs while steppers/heaters are active
pin: PF9
max_power: 1.0
kick_start_time: 0.5
fan_speed: 0.66

[heater_fan controller_fan_2]
# Electronics bay, runs while the bed is above 80C
pin: PF6
kick_start_time: 0.5
heater: heater_bed
heater_temp: 80
fan_speed: 0.66
