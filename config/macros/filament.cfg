# Filament change / load / unload.
# Mid-print: M600 (or the Mainsail macro button) pauses, parks at the front, unloads and shows a dialog
# with Load / Purge more / Resume buttons. In Orca: preview layer slider -> "Add custom G-code" -> M600.
# Builds on Mainsail's PAUSE/RESUME (mainsail.cfg); the hooks are set in _CLIENT_VARIABLE (macros/printing.cfg).
# Version-controlled in github.com/rollibolly/3d-printing - deploy with scripts/deploy.py.

[gcode_macro _FILAMENT_VARS]
description: Tunables for M600 / LOAD_FILAMENT / UNLOAD_FILAMENT / PURGE_FILAMENT
variable_default_temp: 240         # used when the nozzle is cold, nothing is paused and no TEMP= is given
variable_load_length: 60           # new filament: extruder gears -> nozzle
variable_purge_length: 30          # pushed through after loading to flush the old colour
variable_extrude_speed: 5          # mm/s for load/purge (~12 mm³/s, within the Dragon HF's flow)
variable_unload_tip_length: 5      # pushed out before unloading to shape a clean tip
variable_unload_length: 80         # pulled back, clears the Clockwork 2 gears
variable_park_z: 50                # M600 parks at least this high so the purge falls clear of the print
variable_standby_minutes: 10       # paused this long without activity -> nozzle off (RESUME reheats it)
gcode:

[gcode_macro M600]
description: Filament change: pause, park at the front and unload; then LOAD_FILAMENT and RESUME
gcode:
    {% set vars = printer["gcode_macro _FILAMENT_VARS"] %}
    {% set park_x = printer.toolhead.axis_maximum.x / 2 %}
    {% set park_y = printer.toolhead.axis_minimum.y + 10 %}
    {% set paused = printer.pause_resume.is_paused %}
    {% set printing = printer.print_stats.state == "printing" %}

    {% if paused %}
        # Already paused from the UI: move from PAUSE's park spot to the filament change spot.
        {% set park_z = [[printer.toolhead.position.z, vars.park_z]|max, printer.toolhead.axis_maximum.z - 5]|min %}
        SAVE_GCODE_STATE NAME=_M600_MOVE
        G90
        G1 Z{park_z} F900
        G1 X{park_x} Y{park_y} F6000
        RESTORE_GCODE_STATE NAME=_M600_MOVE
    {% elif printing %}
        PAUSE X={park_x} Y={park_y} Z_MIN={vars.park_z}
    {% endif %}

    UNLOAD_FILAMENT
    {% if paused or printing %}
        _FILAMENT_CHANGE_PROMPT
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Heat if needed, form a tip and pull the filament out of the extruder. [TEMP=<C>]
gcode:
    {% set vars = printer["gcode_macro _FILAMENT_VARS"] %}
    {% set was_cold = not printer.extruder.can_extrude %}
    _FILAMENT_HEAT {% if params.TEMP is defined %}TEMP={params.TEMP}{% endif %}
    SAVE_GCODE_STATE NAME=_FILAMENT
    M83
    G1 E{vars.unload_tip_length} F300   ; soften and push out a little
    G1 E-15 F2400                       ; snap back out of the melt zone
    G1 E-{vars.unload_length - 15} F1200
    M400
    RESTORE_GCODE_STATE NAME=_FILAMENT
    RESPOND MSG="Filament unloaded - pull it out of the toolhead"
    {% if printer.pause_resume.is_paused %}
        _FILAMENT_STANDBY_START
    {% elif was_cold %}
        M104 S0
    {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat if needed, feed new filament to the nozzle and purge. [TEMP=<C>] [PURGE=<mm>]
gcode:
    {% set vars = printer["gcode_macro _FILAMENT_VARS"] %}
    {% set purge = params.PURGE|default(vars.purge_length)|float %}
    PURGE_FILAMENT LENGTH={vars.load_length + purge} {% if params.TEMP is defined %}TEMP={params.TEMP}{% endif %}

[gcode_macro PURGE_FILAMENT]
description: Heat if needed and push filament through the nozzle, e.g. to flush the old colour. [LENGTH=<mm>] [TEMP=<C>]
gcode:
    {% set vars = printer["gcode_macro _FILAMENT_VARS"] %}
    {% set length = params.LENGTH|default(20)|float %}
    {% set was_cold = not printer.extruder.can_extrude %}
    _FILAMENT_HEAT {% if params.TEMP is defined %}TEMP={params.TEMP}{% endif %}
    SAVE_GCODE_STATE NAME=_FILAMENT
    M83
    G1 E{length} F{vars.extrude_speed * 60}
    G1 E-1 F2400                        ; small retract against ooze (RESUME un-retracts 1mm)
    M400
    RESTORE_GCODE_STATE NAME=_FILAMENT
    {% if printer.pause_resume.is_paused %}
        _FILAMENT_STANDBY_START
    {% elif was_cold %}
        M104 S0
    {% endif %}

# Heat to TEMP=, else the paused print's temperature, else the current target, else default_temp.
[gcode_macro _FILAMENT_HEAT]
gcode:
    {% set vars = printer["gcode_macro _FILAMENT_VARS"] %}
    {% set saved = printer["gcode_macro RESUME"].last_extruder_temp %}
    {% set target = printer.extruder.target %}
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}
    {% set temp = params.TEMP|float if params.TEMP is defined
             else saved.temp if printer.pause_resume.is_paused and saved.temp >= min_temp
             else target if target >= min_temp
             else vars.default_temp %}
    UPDATE_DELAYED_GCODE ID=_FILAMENT_STANDBY DURATION=0
    {% if printer.extruder.temperature < temp - 3 or target != temp %}
        RESPOND MSG="Heating nozzle to {temp|int}C"
    {% endif %}
    M109 S{temp}

[gcode_macro _FILAMENT_CHANGE_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Filament change"
    RESPOND TYPE=command MSG="action:prompt_text Old filament is unloaded. Pull it out, insert the new one into the extruder and press Load."
    RESPOND TYPE=command MSG="action:prompt_text Purge more until the colour is clean, remove the purged strand from the bed, then Resume."
    RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
    RESPOND TYPE=command MSG="action:prompt_button Purge more|PURGE_FILAMENT|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Unload again|UNLOAD_FILAMENT|warning"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume print|RESUME|success"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_STANDBY_START]
gcode:
    {% set vars = printer["gcode_macro _FILAMENT_VARS"] %}
    {% if printer.pause_resume.is_paused and vars.standby_minutes > 0 %}
        UPDATE_DELAYED_GCODE ID=_FILAMENT_STANDBY DURATION={vars.standby_minutes * 60}
    {% endif %}

# Nozzle off during a long pause; Mainsail's RESUME sees idle_state and reheats to the print temperature.
[delayed_gcode _FILAMENT_STANDBY]
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Paused for {printer['gcode_macro _FILAMENT_VARS'].standby_minutes} min - nozzle off. LOAD_FILAMENT / RESUME reheat it."
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=True
        M104 S0
    {% endif %}

# RESUME / CANCEL hook: close the dialog, stop the standby timer.
[gcode_macro _FILAMENT_CHANGE_END]
gcode:
    UPDATE_DELAYED_GCODE ID=_FILAMENT_STANDBY DURATION=0
    RESPOND TYPE=command MSG="action:prompt_end"
