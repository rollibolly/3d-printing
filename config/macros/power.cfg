# POWER_OFF_PRINTER: make "off" as complete as software can. There is no mains switch (smart plug/relay), so the
# power supply stays on; this cools the hotend, switches heaters/fans/motors/lights off and shuts the host down.
# Use it instead of Mainsail's "Shutdown" menu entry: that one stops the host immediately, and the LED strips
# keep showing their last color (neopixels latch their data) and a hot hotend loses its fan.

[gcode_macro POWER_OFF_PRINTER]
description: Cool down, switch heaters/fans/motors/lights off, then shut down the host
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        RESPOND TYPE=error MSG="POWER_OFF_PRINTER: a print is {printer.print_stats.state}; cancel it first"
    {% else %}
        _HEAT_SOAK_STOP
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION=0
        UPDATE_DELAYED_GCODE ID=_CASELIGHT_OFF DURATION=0
        TURN_OFF_HEATERS
        M107
        SET_FAN_SPEED FAN=nevermore SPEED=0
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% if printer.extruder.temperature > 50 %}
            RESPOND MSG="Waiting for the hotend to cool below 50C (hotend fan keeps running)..."
            STATUS_COOLING
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=50
        {% endif %}
        M84
        SET_PIN PIN=caselight VALUE=0
        STATUS_OFF
        SET_LED LED=sb_leds RED=0 GREEN=0 BLUE=0 WHITE=0
        SET_LED LED=disco_stick RED=0 GREEN=0 BLUE=0
        RESPOND MSG="Shutting down the host. Wait ~30 s, then switch the power supply off."
        G4 P2000
        _HOST_SHUTDOWN
    {% endif %}

# Separate macro: its template (and so the shutdown call) is only evaluated when it runs, i.e. after the cooldown.
[gcode_macro _HOST_SHUTDOWN]
gcode:
    {action_call_remote_method("shutdown_machine")}
