# Manual heat soak for enclosed materials (ABS/ASA/...): run it before starting a print when the part needs it.
#   HEAT_SOAK [BED=100] [MINUTES=10] [CHAMBER=<C>]
#   CANCEL_HEAT_SOAK
# Non-blocking: the countdown runs from a delayed_gcode timer, so the console stays usable and a print can be
# started at any time (PRINT_START stops a running soak). The countdown starts once the bed is at temperature.
# CHAMBER waits for the chamber sensor instead of a timer (needs _PRINT_VARS.chamber_sensor).
# Klipper's idle_timeout still turns the heaters off if the printer is left idle afterwards.

[gcode_macro HEAT_SOAK]
description: Heat bed + chamber before a print. HEAT_SOAK [BED=100] [MINUTES=10] [CHAMBER=<C>]
variable_active: 0
variable_remaining: 0
variable_bed: 0
variable_chamber: 0
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    {% set BED = params.BED|default(vars.soak_bed_temp)|float %}
    {% set MINUTES = params.MINUTES|default(vars.soak_minutes)|int %}
    {% set CHAMBER = params.CHAMBER|default(0)|float %}
    {% if CHAMBER > 0 and vars.chamber_sensor == '' %}
        RESPOND TYPE=error MSG="HEAT_SOAK: CHAMBER= needs a chamber sensor (_PRINT_VARS.chamber_sensor); using the {MINUTES} min timer"
        {% set CHAMBER = 0 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=remaining VALUE={MINUTES}
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=bed VALUE={BED}
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=chamber VALUE={CHAMBER}

    UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION=0
    SET_FAN_SPEED FAN=nevermore SPEED={vars.nevermore_speed}
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    STATUS_HEATING
    M140 S{BED}
    _CG28
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z20 F6000

    RESPOND MSG="Heat soak: bed to {BED|int}C, then {('until chamber ' ~ CHAMBER|int ~ 'C') if CHAMBER > 0 else (MINUTES ~ ' min')}. Start the print any time; CANCEL_HEAT_SOAK aborts."
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=1

[gcode_macro CANCEL_HEAT_SOAK]
description: Stop a running heat soak and turn the bed and Nevermore off
gcode:
    _HEAT_SOAK_STOP
    M140 S0
    SET_FAN_SPEED FAN=nevermore SPEED=0
    STATUS_READY
    RESPOND MSG="Heat soak cancelled"

[gcode_macro _HEAT_SOAK_STOP]
gcode:
    UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=active VALUE=0

[delayed_gcode _HEAT_SOAK_TICK]
gcode:
    {% set soak = printer["gcode_macro HEAT_SOAK"] %}
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    {% if not soak.active %}
        # stopped meanwhile
    {% elif printer.heater_bed.target < soak.bed - 0.5 %}
        _HEAT_SOAK_STOP
        RESPOND MSG="Heat soak stopped: bed target was changed"
    {% elif printer.heater_bed.temperature < soak.bed - 2 %}
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=10
    {% elif soak.chamber > 0 %}
        {% set chamber_temp = printer["temperature_sensor " ~ vars.chamber_sensor].temperature %}
        {% if chamber_temp >= soak.chamber %}
            _HEAT_SOAK_STOP
            STATUS_READY
            RESPOND MSG="Heat soak done: chamber {chamber_temp|round(1)}C - ready to print"
        {% else %}
            RESPOND MSG="Heat soak: chamber {chamber_temp|round(1)}C / {soak.chamber|int}C"
            UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=60
        {% endif %}
    {% elif soak.remaining > 0 %}
        RESPOND MSG="Heat soak: {soak.remaining} min left"
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=remaining VALUE={soak.remaining - 1}
        UPDATE_DELAYED_GCODE ID=_HEAT_SOAK_TICK DURATION=60
    {% else %}
        _HEAT_SOAK_STOP
        STATUS_READY
        RESPOND MSG="Heat soak done: bed holding {soak.bed|int}C - ready to print"
    {% endif %}
