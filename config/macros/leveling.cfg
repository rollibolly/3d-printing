# Homing / leveling / meshing wrappers that drive the Stealthburner status LEDs.

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    STATUS_LEVELING
    _QUAD_GANTRY_LEVEL {rawparams}
    STATUS_READY

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    STATUS_MESHING
    _BED_MESH_CALIBRATE {rawparams}
    STATUS_READY

# Home only if not all axes are homed
[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}

# Full level: home, QGL, re-home Z, then move to bed center
[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    _CG28
    QUAD_GANTRY_LEVEL
    G28
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z30 F3600
