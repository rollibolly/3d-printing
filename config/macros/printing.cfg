# Print lifecycle macros called by the slicer.
# OrcaSlicer start gcode:
#   PRINT_START EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] MATERIAL=[filament_type[initial_extruder]] CHAMBER=[chamber_temperature[initial_extruder]]
# CHAMBER is accepted but unused here; heat soak is manual, see macros/heat_soak.cfg (HEAT_SOAK).
# Version-controlled in github.com/rollibolly/3d-printing - deploy with scripts/deploy.py.

[gcode_macro _PRINT_VARS]
description: Tunables for PRINT_START / PRINT_END
variable_enclosed_materials: ['ABS', 'ASA', 'PC', 'PA', 'PA-CF', 'PA-GF', 'PC-CF', 'ABS-GF', 'ASA-CF', 'PPS', 'PPA']
variable_soak_minutes: 10          # HEAT_SOAK default duration
variable_soak_bed_temp: 100        # HEAT_SOAK default bed temperature
variable_probe_temp: 150           # nozzle preheat while homing/leveling (probe-safe, see [probe] activate_gcode)
variable_chamber_sensor: ''        # e.g. 'chamber' once [temperature_sensor chamber] exists; HEAT_SOAK CHAMBER=<C> then waits for it
variable_nevermore_speed: 1.0      # Nevermore during enclosed-material prints
variable_nevermore_after_minutes: 10  # keep filtering this long after an enclosed-material print ends
variable_exhaust_speed: 0.5        # exhaust fan during PLA/PETG/... prints, keeps the chamber cool
variable_enclosed_print: 0         # set by PRINT_START, read by PRINT_END / cancel
gcode:

[gcode_macro PRINT_START]
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|float %}
    {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
    {% set ENCLOSED = MATERIAL in vars.enclosed_materials %}
    {% set soak = printer["gcode_macro HEAT_SOAK"] %}

    RESPOND MSG="PRINT_START: {MATERIAL}, bed {BED_TEMP|int}C, nozzle {EXTRUDER_TEMP|int}C"
    {% if soak.active %}
        RESPOND MSG="Heat soak was still running ({soak.remaining} min left) - stopping it, the print starts now"
        _HEAT_SOAK_STOP
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINT_VARS VARIABLE=enclosed_print VALUE={1 if ENCLOSED else 0}
    _CHAMBER_FANS_START

    STATUS_HEATING
    M140 S{BED_TEMP}
    M104 S{[EXTRUDER_TEMP, vars.probe_temp|float]|min}   ; nozzle to probe-safe temp while the bed heats
    _CG28
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z20 F6000
    M190 S{BED_TEMP}

    G32                            ; QGL + re-home Z
    BED_MESH_CALIBRATE ADAPTIVE=1  ; mesh only the area covered by the print
    SMART_PARK                     ; wait next to the print area while the nozzle heats

    STATUS_HEATING
    M109 S{EXTRUDER_TEMP}

    STATUS_PRINTING
    LINE_PURGE

[gcode_macro PRINT_END]
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off part fan
    _CHAMBER_FANS_END
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y-10} F3600  ; park at rear center
    BED_MESH_CLEAR

    # Restore coordinate system/speeds changed above; MOVE=0 prevents an unintended toolhead move.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    STATUS_PART_READY

#####################################################################
# 	Chamber fans (Nevermore for enclosed materials, exhaust otherwise)
#####################################################################

[gcode_macro _CHAMBER_FANS_START]
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION=0   ; cancel a pending post-print shutoff
    {% if vars.enclosed_print %}
        SET_FAN_SPEED FAN=nevermore SPEED={vars.nevermore_speed}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% else %}
        SET_FAN_SPEED FAN=nevermore SPEED=0
        SET_FAN_SPEED FAN=exhaust_fan SPEED={vars.exhaust_speed}
    {% endif %}

[gcode_macro _CHAMBER_FANS_END]
gcode:
    {% set vars = printer["gcode_macro _PRINT_VARS"] %}
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% if vars.enclosed_print and vars.nevermore_after_minutes > 0 %}
        RESPOND MSG="Nevermore keeps filtering for {vars.nevermore_after_minutes} min"
        UPDATE_DELAYED_GCODE ID=_NEVERMORE_OFF DURATION={vars.nevermore_after_minutes * 60}
    {% else %}
        SET_FAN_SPEED FAN=nevermore SPEED=0
    {% endif %}

[delayed_gcode _NEVERMORE_OFF]
gcode:
    SET_FAN_SPEED FAN=nevermore SPEED=0

# Hook into Mainsail's PAUSE/RESUME/CANCEL macros (mainsail.cfg); unset options keep Mainsail's defaults.
[gcode_macro _CLIENT_VARIABLE]
variable_user_cancel_macro: "_CHAMBER_FANS_END"
gcode:
