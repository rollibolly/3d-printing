# Fan command guards.
# Klipper's M106 ignores the P (fan index) parameter and always drives the part fan, but OrcaSlicer emits
# `M106 P3 S<speed>` for its "exhaust fan" (even with air filtration disabled in the printer profile).
# That would run the part fan at the end of every print. Chamber fans are handled by PRINT_START/PRINT_END,
# so drop any M106 aimed at another fan index.

[gcode_macro M106]
description: Set part fan speed (ignores slicer fan indexes other than P0)
rename_existing: M106.1
gcode:
    {% if params.P is defined and params.P|int != 0 %}
        RESPOND MSG="Ignored M106 P{params.P} (chamber fans are managed by PRINT_START/PRINT_END)"
    {% else %}
        M106.1 {rawparams}
    {% endif %}
