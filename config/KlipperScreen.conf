# KlipperScreen config. Custom menus: the most-used macros up front.
# use_default_menu: False drops KlipperScreen's built-in __main/__print/__splashscreen menus, so every
# menu item lives here (defaults copied from KlipperScreen's config/*_menu.conf, v0.4.7).
# Version-controlled in github.com/rollibolly/3d-printing - deploy with scripts/deploy.py.

[main]
use_default_menu: False

#####################################################################
# 	Main screen (idle)
#####################################################################

[menu __main]
name: Main Menu

[menu __main print]
name: Print
icon: printer
panel: gcodes

[menu __main temperature]
name: Temperature
icon: heat-up
panel: temperature
enable: {{ (printer.temperature_devices.count > 0) or (printer.extruders.count > 0) }}

[menu __main move]
name: Move
icon: move
panel: move

[menu __main filament]
name: Filament
icon: filament

[menu __main prepare]
name: Prepare
icon: bed-level

[menu __main parkfront]
name: Park Front
icon: arrow-down
method: printer.gcode.script
params: {"script": "PARKFRONT"}

[menu __main macros]
name: Macros
icon: custom-script
panel: gcode_macros

[menu __main poweroff]
name: Power Off
icon: shutdown
method: printer.gcode.script
params: {"script": "POWER_OFF_PRINTER"}
confirm: Cool down, switch everything off and shut down the Pi?

[menu __main more]
name: More
icon: settings

# Filament: macros/filament.cfg
[menu __main filament load]
name: Load
icon: load
method: printer.gcode.script
params: {"script": "LOAD_FILAMENT"}

[menu __main filament unload]
name: Unload
icon: retract
method: printer.gcode.script
params: {"script": "UNLOAD_FILAMENT"}

[menu __main filament purge]
name: Purge 20mm
icon: extrude
method: printer.gcode.script
params: {"script": "PURGE_FILAMENT"}

[menu __main filament extrude]
name: Extrude Panel
icon: extruder
panel: extrude

# Prepare: homing/leveling (macros/leveling.cfg), heat soak (macros/heat_soak.cfg)
[menu __main prepare home]
name: Home All
icon: home
method: printer.gcode.script
params: {"script": "G28"}

[menu __main prepare g32]
name: Home + QGL
icon: z-tilt
method: printer.gcode.script
params: {"script": "G32"}

[menu __main prepare heatsoak]
name: Heat Soak
icon: heat-up
method: printer.gcode.script
params: {"script": "HEAT_SOAK"}
confirm: Heat the bed to 100C and soak for 10 min?

[menu __main prepare cancelsoak]
name: Stop Heat Soak
icon: cool-down
method: printer.gcode.script
params: {"script": "CANCEL_HEAT_SOAK"}

[menu __main prepare cooldown]
name: Cool Down
icon: cool-down
method: printer.gcode.script
params: {"script": "TURN_OFF_HEATERS"}

[menu __main prepare motoroff]
name: Motors Off
icon: motor-off
method: printer.gcode.script
params: {"script": "M84"}

[menu __main prepare bedmesh]
name: Bed Mesh
icon: bed-mesh
panel: bed_mesh
enable: {{ 'bed_mesh' in printer.config_sections }}

[menu __main prepare zoffset]
name: Z Calibrate
icon: z-farther
panel: zcalibrate

[menu __main prepare input_shaper]
name: Input Shaper
icon: move
panel: input_shaper
enable: {{ 'input_shaper' in printer.config_sections }}

# More: the rest of KlipperScreen's defaults
[menu __main more fan]
name: Fan
icon: fan
panel: fan
enable: {{ printer.fans.count > 0 }}

[menu __main more led]
name: Leds
icon: light
panel: led
enable: {{ printer.leds.count > 0 }}

[menu __main more pins]
name: Pins
icon: hashtag
panel: pins
enable: {{ printer.output_pins.count > 0 or printer.pwm_tools.count > 0 }}

[menu __main more limits]
name: Limits
icon: fine-tune
panel: limits

[menu __main more fine_tune]
name: Fine Tuning
icon: fine-tune
panel: fine_tune

[menu __main more camera]
name: Camera
icon: camera
panel: camera
enable: {{ moonraker.cameras.count > 0 }}

[menu __main more console]
name: Console
icon: console
panel: console

[menu __main more bedlevel]
name: Bed Level
icon: bed-level
panel: bed_level
enable: {{ 'bed_screws' in printer.config_sections or 'screws_tilt_adjust' in printer.config_sections }}

[menu __main more save]
name: Save Config
icon: complete
method: ks_confirm_save

[menu __main more power]
name: Power
icon: shutdown
panel: power
enable: {{ moonraker.power_devices.count > 0 }}

[menu __main more spoolman]
name: Spoolman
icon: spoolman
panel: spoolman
enable: {{ moonraker.spoolman }}

[menu __main more notifications]
name: Notifications
icon: notifications
panel: notifications

[menu __main more network]
name: Network
icon: network
panel: network

[menu __main more updater]
name: Update
icon: refresh
panel: updater

[menu __main more system]
name: System
icon: info
panel: system
enable: {{ moonraker_connected }}

[menu __main more settings]
name: KlipperScreen
icon: settings
panel: settings

