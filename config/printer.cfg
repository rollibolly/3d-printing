# Voron 2.4 350 - main Klipper config.
# Hardware lives in hardware/, macros in macros/. Version-controlled in
# github.com/rollibolly/3d-printing - edit there and deploy with scripts/deploy.py.

[include mainsail.cfg]
[include hardware/mcu.cfg]
[include hardware/steppers.cfg]
[include hardware/toolhead.cfg]
[include hardware/bed.cfg]
[include hardware/fans.cfg]
[include hardware/lights.cfg]
[include led_effects/stealthburner_led_effects_3_leds.cfg]
[include KAMP_Settings.cfg]
[include macros/*.cfg]

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[exclude_object]

[idle_timeout]
timeout: 3300

[gcode_arcs]
resolution: 1.0

